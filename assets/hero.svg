<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Muhammad Faris Akbar - Full Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="48%" stop-color="#0b1026"/>
      <stop offset="100%" stop-color="#080b18"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="48%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <radialGradient id="orbBlue">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orbViolet">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#7dd3fc" stroke-opacity=".055" stroke-width="1"/>
    </pattern>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <clipPath id="rounded">
      <rect x="1" y="1" width="1198" height="358" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>

    <circle cx="120" cy="70" r="270" fill="url(#orbBlue)">
      <animate attributeName="cx" values="80;180;80" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="65;115;65" dur="9s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1060" cy="310" r="300" fill="url(#orbViolet)">
      <animate attributeName="cx" values="1080;970;1080" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="310;240;310" dur="10s" repeatCount="indefinite"/>
    </circle>

    <rect x="-250" y="-8" width="180" height="376" fill="#38bdf8" opacity=".025" transform="skewX(-18)">
      <animate attributeName="x" values="-300;1450" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- floating particles -->
    <g fill="#7dd3fc">
      <circle cx="95" cy="80" r="2" opacity=".7">
        <animate attributeName="opacity" values=".2;1;.2" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="235" cy="300" r="1.8" opacity=".5">
        <animate attributeName="cy" values="310;270;310" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".1;.9;.1" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="515" cy="55" r="1.5">
        <animate attributeName="opacity" values=".15;.8;.15" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1090" cy="78" r="2">
        <animate attributeName="opacity" values=".1;1;.1" dur="4.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="965" cy="290" r="1.6">
        <animate attributeName="cy" values="302;265;302" dur="5.7s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- left identity block -->
    <g font-family="Inter,Segoe UI,Arial,sans-serif">
      <text x="72" y="72" font-size="15" font-weight="600" fill="#7dd3fc" letter-spacing="4">SOFTWARE / WEB / MOBILE / BACKEND</text>

      <text x="70" y="145" font-size="50" font-weight="800" fill="#f8fafc" letter-spacing="-1.4">
        Muhammad Faris
      </text>
      <text x="70" y="198" font-size="50" font-weight="800" fill="url(#accent)" letter-spacing="-1.4">
        Akbar
      </text>

      <text x="72" y="240" font-size="18" fill="#9ca3af">
        Building maintainable systems from interface to infrastructure.
      </text>

      <!-- pills -->
      <g font-size="13" font-weight="600">
        <rect x="72" y="272" width="92" height="32" rx="16" fill="#38bdf8" fill-opacity=".09" stroke="#38bdf8" stroke-opacity=".35"/>
        <text x="118" y="293" text-anchor="middle" fill="#bae6fd">REACT</text>

        <rect x="174" y="272" width="126" height="32" rx="16" fill="#6366f1" fill-opacity=".10" stroke="#818cf8" stroke-opacity=".35"/>
        <text x="237" y="293" text-anchor="middle" fill="#c7d2fe">TYPESCRIPT</text>

        <rect x="310" y="272" width="72" height="32" rx="16" fill="#22d3ee" fill-opacity=".09" stroke="#22d3ee" stroke-opacity=".35"/>
        <text x="346" y="293" text-anchor="middle" fill="#a5f3fc">GO</text>

        <rect x="392" y="272" width="126" height="32" rx="16" fill="#a855f7" fill-opacity=".09" stroke="#c084fc" stroke-opacity=".35"/>
        <text x="455" y="293" text-anchor="middle" fill="#e9d5ff">POSTGRESQL</text>
      </g>
    </g>

    <!-- terminal -->
    <g>
      <rect x="650" y="50" width="480" height="260" rx="18" fill="#070b16" fill-opacity=".88" stroke="#64748b" stroke-opacity=".28"/>
      <rect x="650" y="50" width="480" height="38" rx="18" fill="#111827" fill-opacity=".96"/>
      <rect x="650" y="70" width="480" height="18" fill="#111827" fill-opacity=".96"/>

      <circle cx="676" cy="69" r="5" fill="#fb7185"/>
      <circle cx="696" cy="69" r="5" fill="#fbbf24"/>
      <circle cx="716" cy="69" r="5" fill="#34d399"/>
      <text x="890" y="74" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" fill="#64748b">faris@github — zsh</text>

      <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">
        <text x="678" y="120" fill="#38bdf8">$</text>
        <text x="698" y="120" fill="#cbd5e1">whoami</text>

        <text x="678" y="151" fill="#a7f3d0">Full Stack Developer</text>
        <text x="678" y="177" fill="#94a3b8">web / mobile / backend</text>

        <text x="678" y="218" fill="#38bdf8">$</text>
        <text x="698" y="218" fill="#cbd5e1">stack --primary</text>

        <text x="678" y="247" fill="#c4b5fd">React · React Native · TypeScript · Go</text>

        <text x="678" y="282" fill="#38bdf8">$</text>
        <rect x="698" y="269" width="8" height="17" rx="1" fill="#e2e8f0">
          <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.45;.5;.95;1" dur="1.05s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- animated bottom pulse -->
    <rect x="0" y="354" width="1200" height="6" fill="#111827"/>
    <rect x="-260" y="354" width="260" height="6" fill="url(#accent)" filter="url(#glow)">
      <animate attributeName="x" values="-260;1200" dur="4.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="1" y="1" width="1198" height="358" rx="28" fill="none" stroke="#64748b" stroke-opacity=".24"/>
</svg>
