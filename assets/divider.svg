<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="44" viewBox="0 0 1200 44">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="65%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-300%" width="200%" height="700%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <line x1="55" y1="22" x2="1145" y2="22" stroke="#334155" stroke-opacity=".45"/>
  <rect x="-180" y="20" width="180" height="4" rx="2" fill="url(#g)" filter="url(#glow)">
    <animate attributeName="x" values="-180;1200" dur="4s" repeatCount="indefinite"/>
  </rect>
  <circle cx="600" cy="22" r="3" fill="#7dd3fc">
    <animate attributeName="r" values="2;5;2" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".35;1;.35" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
