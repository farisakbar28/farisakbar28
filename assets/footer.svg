<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Build Ship Learn Repeat">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#0b1026"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <rect width="1200" height="150" rx="24" fill="url(#bg)"/>
  <path d="M0 122 C180 85 280 154 460 112 S770 80 1200 118" fill="none" stroke="#38bdf8" stroke-opacity=".15"/>
  <path d="M0 132 C220 92 360 150 520 119 S870 92 1200 126" fill="none" stroke="#8b5cf6" stroke-opacity=".16"/>

  <text x="600" y="66" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="4" fill="#e2e8f0">
    BUILD  ·  SHIP  ·  LEARN  ·  REPEAT
  </text>
  <text x="600" y="94" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" fill="#64748b">
    farisakbar28 / engineering in motion
  </text>

  <rect x="-240" y="118" width="240" height="3" rx="2" fill="url(#line)" filter="url(#glow)">
    <animate attributeName="x" values="-240;1200" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
